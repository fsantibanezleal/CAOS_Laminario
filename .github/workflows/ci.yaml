name: ci

# Cheap checks on committed files only: lint and guards. No test suite, no processing, no imaging
# stack: the full test suite runs locally before every push. Trunk and manual triggers only;
# superseded runs are cancelled.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: pip install ruff==0.16.8 && ruff check app tests scripts
      - name: Contract schemas match the models (stdlib plus pydantic, no server stack)
        run: pip install pydantic==2.13.5 pydantic-settings==2.15.0 && python scripts/export_contracts.py --check

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Contract types match the committed schemas
        run: node scripts/check-contract-drift.mjs
      - name: Type check and build
        run: npm run build

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository hygiene (no env, venv, slides, pyramids, databases or local paths tracked)
        run: python scripts/check_repo_hygiene.py
      - name: No template residue
        run: python scripts/check_template_residue.py
      - name: No em-dash or emoji
        run: python scripts/check_content_standards.py
      - name: CI budget
        run: python scripts/check_ci_budget.py
      - name: The design document, every requirement names a gate that exists
        run: python scripts/check_sdd.py
      - name: Shell scripts are executable
        run: |
          if git ls-files -s '*.sh' | grep -qv '^100755'; then
            git ls-files -s '*.sh' | grep -v '^100755'
            echo "::error::a tracked .sh file is not mode 100755"; exit 1; fi
          echo "shell modes: OK"
