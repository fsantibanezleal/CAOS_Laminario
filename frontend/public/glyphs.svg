<svg xmlns="http://www.w3.org/2000/svg">
<!-- Interface glyphs, drawn for Laminario on the icon system's 32-unit grid with its 1.75 stroke (docs/design/visual-system.md, section 7). Unframed: these are actions, not collection places. -->
<symbol id="close" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M9 9l14 14M23 9L9 23"/></symbol>
<symbol id="search" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="14" cy="14" r="7.5"/><path d="M19.5 19.5L25 25"/></symbol>
<symbol id="check" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16.5l5.5 5.5L24 10.5"/></symbol>
<symbol id="chevron-down" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13l6 6 6-6"/></symbol>
<symbol id="chevron-right" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 10l6 6-6 6"/></symbol>
<symbol id="daylight" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="16" cy="16" r="5"/><path d="M16 5v3M16 24v3M5 16h3M24 16h3M8.2 8.2l2.1 2.1M21.7 21.7l2.1 2.1M8.2 23.8l2.1-2.1M21.7 10.3l2.1-2.1"/></symbol>
<symbol id="lamplit" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 8h10l3 8H8z"/><path d="M16 16v7M11 26h10"/><path d="M12 19.5l-2 2.5M20 19.5l2 2.5" opacity=".6"/></symbol>
<symbol id="system" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="8" width="20" height="13" rx="1.5"/><path d="M12 25h8M16 21v4"/><path d="M16 11.5a3 3 0 0 0 0 6z" fill="currentColor" stroke="none"/></symbol>
<symbol id="language" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="10"/><path d="M6 16h20M16 6c3 3 4.5 6.5 4.5 10S19 23 16 26c-3-3-4.5-6.5-4.5-10S13 9 16 6z"/></symbol>
<symbol id="info" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="16" cy="16" r="10"/><path d="M16 15v6"/><circle cx="16" cy="11" r="1.1" fill="currentColor" stroke="none"/></symbol>
<symbol id="warning" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6l11 19H5z"/><path d="M16 13v6"/><circle cx="16" cy="22" r="1.1" fill="currentColor" stroke="none"/></symbol>
<symbol id="plus" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M16 9v14M9 16h14"/></symbol>
<symbol id="slide" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><rect x="3" y="11" width="26" height="10" rx="1"/><path d="M9.5 11v10"/><circle cx="19" cy="16" r="3"/></symbol>
<symbol id="minus" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M9 16h14"/></symbol>
<symbol id="cabinet" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="4" width="18" height="24" rx="1"/><path d="M7 12h18M7 20h18"/><path d="M14 8h4M14 16h4M14 24h4"/></symbol>
<symbol id="map" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l7-3 10 3 7-3v19l-7 3-10-3-7 3z"/><path d="M11 5v19M21 8v19"/></symbol>
<symbol id="filter" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M5 9h22M9 16h14M13 23h6"/></symbol>
<symbol id="pin" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 28s-8-8.3-8-14a8 8 0 0 1 16 0c0 5.7-8 14-8 14z"/><circle cx="16" cy="14" r="3"/></symbol>
<symbol id="cell" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="6" y="6" width="20" height="20" rx="1" stroke-dasharray="3 3"/><circle cx="18" cy="13" r="2.2" fill="currentColor" stroke="none"/></symbol>
</svg>
