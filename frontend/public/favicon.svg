<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .glass { fill: #fefcf9; stroke: #8e5318; }
    .end { fill: #e2cdba; }
    .spec { fill: #3c732f; }
    @media (prefers-color-scheme: dark) {
      .glass { fill: #151a21; stroke: #ebb25f; }
      .end { fill: #3a2a1f; }
      .spec { fill: #96cb8b; }
    }
  </style>
  <rect class="glass" x="2" y="10" width="28" height="12" rx="1.5" stroke-width="1.5"/>
  <rect class="end" x="2.75" y="10.75" width="7" height="10.5" rx="1"/>
  <circle class="spec" cx="20" cy="16" r="3.5"/>
</svg>
