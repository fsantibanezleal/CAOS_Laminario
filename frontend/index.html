<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Laminario</title>
    <meta name="description" content="A collection of microscope slides: plants, animals, microbes, fossils, rocks, minerals, crystals and materials." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/laminario-sans-roman.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Before the first paint: the room (data-theme) and the language (lang) the visitor chose on this device, else
      // the system's preference and the browser's first English or Spanish language. src/design/theme.tsx and
      // src/i18n/index.tsx take over from here.
      (function () {
        var root = document.documentElement;
        var room = null;
        var lang = null;
        try {
          room = localStorage.getItem("laminario.theme");
          lang = localStorage.getItem("laminario.lang");
        } catch (e) {}
        if (room !== "daylight" && room !== "lamplit") {
          room = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "lamplit" : "daylight";
        }
        if (lang !== "en" && lang !== "es") {
          var wanted = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
          lang = "en";
          for (var i = 0; i < wanted.length; i++) {
            var code = String(wanted[i]).slice(0, 2).toLowerCase();
            if (code === "en" || code === "es") { lang = code; break; }
          }
        }
        root.setAttribute("data-theme", room);
        root.setAttribute("lang", lang);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
