<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Laminario imaging engine</title>
  <desc id="desc">A file is described by the reader from its headers and checked against the limits. Every kept focal plane is written as a pyramidal BigTIFF whose fidelity is measured. A focal stack is also fused: a variance height map gives the depth readout and a complex wavelet composite is the default image. Derivatives are written without EXIF.</desc>
  <style>
    :root { --bg: #fbfaf7; --ink: #1d232b; --muted: #5b6573; --line: #8a94a3; --box: #ffffff; --edge: #c9ced6;
            --accent: #1f6f8b; --warm: #b5651d; --store: #efe9dc; --lane: #f3f5f8; --good: #2f7d4f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1419; --ink: #e6e9ee; --muted: #9aa5b4; --line: #6b7686; --box: #18202a; --edge: #2c3744;
              --accent: #5bb4d4; --warm: #e0a15c; --store: #231f18; --lane: #141b23; --good: #6fc08f; }
    }
    .bg { fill: var(--bg); }
    .box { fill: var(--box); stroke: var(--edge); stroke-width: 1.5; }
    .key { fill: var(--box); stroke: var(--accent); stroke-width: 1.8; }
    .store { fill: var(--store); stroke: var(--warm); stroke-width: 1.5; }
    .lane { fill: var(--lane); stroke: var(--edge); stroke-width: 1; stroke-dasharray: 4 4; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
    .m { font: 11.5px ui-monospace, "Cascadia Mono", Consolas, monospace; fill: var(--muted); }
    .h { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--accent); letter-spacing: .06em; }
    .ok { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--good); }
    .arrow { stroke: var(--line); stroke-width: 1.6; fill: none; marker-end: url(#head); }
    .head { fill: var(--line); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="600"/>

  <!-- input -->
  <text class="h" x="24" y="34">INPUT</text>
  <rect class="box" x="24" y="46" width="200" height="118" rx="8"/>
  <text class="t" x="40" y="72">Accepted file</text>
  <text class="m" x="40" y="94">SVS, NDPI, MRXS ...</text>
  <text class="m" x="40" y="112">(OpenSlide)</text>
  <text class="m" x="40" y="132">TIFF, ImageJ stack,</text>
  <text class="m" x="40" y="150">JPEG, PNG, WebP</text>

  <rect class="key" x="264" y="46" width="236" height="118" rx="8"/>
  <text class="t" x="280" y="72">reader.read_info</text>
  <text class="s" x="280" y="93">headers only, no pixels decoded</text>
  <text class="m" x="280" y="113">levels, um/px, objective,</text>
  <text class="m" x="280" y="131">label / macro / thumbnail,</text>
  <text class="m" x="280" y="149">focal planes + depths, slide mm</text>

  <rect class="box" x="540" y="46" width="190" height="118" rx="8"/>
  <text class="t" x="556" y="72">guards</text>
  <text class="m" x="556" y="96">side &lt;= 200,000 px</text>
  <text class="m" x="556" y="116">plane &lt;= 20 Gpx</text>
  <text class="s" x="556" y="142">else refused (R-017)</text>

  <rect class="box" x="770" y="46" width="166" height="118" rx="8"/>
  <text class="t" x="786" y="72">zstack policy</text>
  <text class="m" x="786" y="96">&lt;= 500 MB: all</text>
  <text class="m" x="786" y="116">else 11 planes,</text>
  <text class="m" x="786" y="136">ends kept, depths</text>
  <text class="s" x="786" y="154">recorded (R-014)</text>

  <path class="arrow" d="M224 105 H262"/>
  <path class="arrow" d="M500 105 H538"/>
  <path class="arrow" d="M730 105 H768"/>

  <!-- per plane -->
  <rect class="lane" x="24" y="196" width="440" height="230" rx="10"/>
  <text class="h" x="40" y="220">EVERY KEPT PLANE</text>
  <rect class="key" x="40" y="234" width="408" height="176" rx="8"/>
  <text class="t" x="56" y="260">pyramid.write_pyramid</text>
  <text class="m" x="56" y="282">BigTIFF, 512 px tiles, levels ceil(log2(n/512))+1</text>
  <text class="m" x="56" y="304">1. JPEG Q85 (4:2:0)  -> PSNR over 32 seeded regions</text>
  <text class="m" x="56" y="324">2. below 38 dB: JPEG Q90, full chroma</text>
  <text class="m" x="56" y="344">3. WebP Q80 kept only if smaller AND &gt;= 38 dB</text>
  <text class="m" x="56" y="364">um/px known: resolution tags in px/cm</text>
  <text class="m" x="56" y="384">unknown: resolution unit "none"</text>
  <text class="ok" x="56" y="402">CMU-1 53.6 dB, louse 44.0, thin section 32.1 -> 49.9</text>

  <!-- stack -->
  <rect class="lane" x="496" y="196" width="440" height="230" rx="10"/>
  <text class="h" x="512" y="220">FOCAL STACKS ONLY (edf.fuse, tiles 1024 / margin 128)</text>
  <rect class="box" x="512" y="234" width="200" height="176" rx="8"/>
  <text class="t" x="528" y="260">variance</text>
  <text class="m" x="528" y="282">5x5 local variance,</text>
  <text class="m" x="528" y="300">plane of the maximum</text>
  <text class="s" x="528" y="326">height map -&gt;</text>
  <text class="s" x="528" y="344">depth readout</text>
  <text class="ok" x="528" y="372">93-99.9 % within</text>
  <text class="ok" x="528" y="390">1 plane of truth</text>

  <rect class="key" x="724" y="234" width="196" height="176" rx="8"/>
  <text class="t" x="740" y="260">complex wavelets</text>
  <text class="m" x="740" y="282">length 14, max scales</text>
  <text class="m" x="740" y="300">max modulus per coeff.</text>
  <text class="m" x="740" y="318">sub-band + 5x5 majority</text>
  <text class="m" x="740" y="336">inverse, reassign pixels</text>
  <text class="s" x="740" y="362">composite (default)</text>
  <text class="ok" x="740" y="390">= EPFL plugin, 100 %</text>

  <path class="arrow" d="M853 164 V194"/>
  <path class="arrow" d="M382 164 V232"/>

  <!-- outputs -->
  <text class="h" x="24" y="466">ON THE DATA VOLUME</text>
  <rect class="store" x="24" y="478" width="440" height="98" rx="8"/>
  <text class="t" x="40" y="504">one BigTIFF per plane + one per composite</text>
  <text class="s" x="40" y="526">read by iipsrv as IIIF Image API 3 (U3)</text>
  <text class="m" x="40" y="550">/srv/laminario/slides/&lt;id&gt;/plane-&lt;k&gt;.tif</text>

  <rect class="box" x="496" y="478" width="440" height="98" rx="8"/>
  <text class="t" x="512" y="504">derivatives</text>
  <text class="m" x="512" y="526">thumbnails 320 / 1024 px, JPEG Q80, ICC only, no EXIF</text>
  <text class="m" x="512" y="546">scan box on the macro photograph (vendor geometry)</text>
  <text class="m" x="512" y="566">true-scale mount: specimen mm / slide mm</text>

  <path class="arrow" d="M244 426 V476"/>
  <path class="arrow" d="M716 426 V476"/>
</svg>
