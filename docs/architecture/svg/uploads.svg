<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Laminario uploads</title>
  <desc id="desc">The browser sends a tus upload through nginx to tusd. Before storing anything tusd asks the API's pre-create hook, with the session cookie forwarded, which checks ownership, sizes, quotas and the disk budget. Bytes go to the quarantine; an interrupted upload resumes from its offset. When the upload is complete, the post-finish hook queues a verification job: checksum, sniffing, a readable header, then the source store and processing, or deletion with the reason.</desc>
  <style>
    :root { --bg: #fbfaf7; --ink: #1d232b; --muted: #5b6573; --line: #8a94a3; --box: #ffffff; --edge: #c9ced6;
            --accent: #1f6f8b; --warm: #b5651d; --store: #efe9dc; --lane: #f3f5f8; --good: #2f7d4f; --stop: #b23a3a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1419; --ink: #e6e9ee; --muted: #9aa5b4; --line: #6b7686; --box: #18202a; --edge: #2c3744;
              --accent: #5bb4d4; --warm: #e0a15c; --store: #231f18; --lane: #141b23; --good: #6fc08f; --stop: #e07a7a; }
    }
    .bg { fill: var(--bg); }
    .box { fill: var(--box); stroke: var(--edge); stroke-width: 1.5; }
    .key { fill: var(--box); stroke: var(--accent); stroke-width: 1.8; }
    .store { fill: var(--store); stroke: var(--warm); stroke-width: 1.5; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
    .m { font: 11.5px ui-monospace, "Cascadia Mono", Consolas, monospace; fill: var(--muted); }
    .h { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--accent); letter-spacing: .06em; }
    .ok { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--good); }
    .no { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--stop); }
    .arrow { stroke: var(--line); stroke-width: 1.6; fill: none; marker-end: url(#head); }
    .dash { stroke: var(--line); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#head); }
    .head { fill: var(--line); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="560"/>

  <text class="h" x="24" y="34">SENDING (tus 1.0)</text>
  <rect class="box" x="24" y="46" width="190" height="150" rx="8"/>
  <text class="t" x="40" y="72">Browser (U12)</text>
  <text class="m" x="40" y="96">POST /files/</text>
  <text class="s" x="40" y="114">length, slide, asset, name</text>
  <text class="m" x="40" y="138">PATCH at Upload-Offset</text>
  <text class="m" x="40" y="160">HEAD after a lost link</text>
  <text class="s" x="40" y="182">resumes where it stopped</text>

  <rect class="box" x="254" y="46" width="200" height="150" rx="8"/>
  <text class="t" x="270" y="72">tusd :8148</text>
  <text class="s" x="270" y="94">v2.10.1, pinned image</text>
  <text class="s" x="270" y="112">loopback, read-only root</text>
  <text class="s" x="270" y="136">forwards the Cookie</text>
  <text class="s" x="270" y="154">to the API's hooks</text>
  <text class="m" x="270" y="180">behind nginx /files/</text>

  <rect class="store" x="254" y="226" width="200" height="90" rx="8"/>
  <text class="t" x="270" y="252">quarantine/</text>
  <text class="m" x="270" y="276">{id}  {id}.info</text>
  <text class="s" x="270" y="298">never served</text>

  <path class="arrow" d="M214 120 H252"/>
  <path class="arrow" d="M354 196 V224"/>

  <rect class="key" x="494" y="46" width="442" height="150" rx="8"/>
  <text class="t" x="510" y="72">pre-create hook (before any byte is stored)</text>
  <text class="s" x="510" y="94">signed in, may submit, owns the draft, the image is pending</text>
  <text class="s" x="510" y="112">and not remote, no other upload for it in progress</text>
  <text class="s" x="510" y="130">length declared, at most 30 GB per file</text>
  <text class="s" x="510" y="148">quota: 40 GB and 20 whole-slide images per account</text>
  <text class="s" x="510" y="166">whole-slide image while the disk is over 90 percent: refused</text>
  <text class="no" x="510" y="188">refusal: RejectUpload + status and reason (401 to 507)</text>
  <path class="arrow" d="M454 120 H492"/>

  <text class="h" x="24" y="366">AFTER THE LAST BYTE</text>
  <rect class="box" x="24" y="378" width="200" height="110" rx="8"/>
  <text class="t" x="40" y="404">post-finish hook</text>
  <text class="s" x="40" y="426">marks it received and</text>
  <text class="s" x="40" y="444">queues verify_upload</text>
  <text class="s" x="40" y="468">(no hashing in a hook)</text>
  <path class="dash" d="M354 316 V342 H200 V376"/>

  <rect class="key" x="254" y="378" width="400" height="160" rx="8"/>
  <text class="t" x="270" y="404">verify_upload (the worker)</text>
  <text class="s" x="270" y="426">1. size as declared; SHA-256</text>
  <text class="s" x="270" y="444">2. sniff the bytes: JPEG, PNG, WebP, TIFF, BigTIFF,</text>
  <text class="s" x="270" y="462">   DICOM; ZIP holding MRXS, VSI or DICOM</text>
  <text class="s" x="270" y="480">3. unpack archives safely; the reader opens the header</text>
  <text class="ok" x="270" y="504">accepted: source store, asset.source_path, processing</text>
  <text class="no" x="270" y="524">refused: deleted from quarantine, the type named</text>
  <path class="arrow" d="M224 432 H252"/>

  <rect class="store" x="694" y="378" width="242" height="160" rx="8"/>
  <text class="t" x="710" y="404">sources/</text>
  <text class="m" x="710" y="428">{slide}/{asset}-{digest}</text>
  <text class="s" x="710" y="452">scanner extensions kept</text>
  <text class="s" x="710" y="470">(OpenSlide needs them)</text>
  <text class="s" x="710" y="496">then process_asset:</text>
  <text class="s" x="710" y="514">the pyramid (U4)</text>
  <path class="arrow" d="M654 458 H692"/>
</svg>
