<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Laminario contribute flow</title>
  <desc id="desc">In the browser, the contributor fills a slide case section by section while the server validates it and answers with coded messages the page words in its language; photographs are read by exifr and, in a private case, rewritten without their GPS position and XMP; a pixel size can be calibrated on a stage micrometer. The case is stored as a draft; its files go to tusd through Uppy's tus plugin, the pre-create hook checks the session, the draft and the quotas; the verify job checks the file and refuses a private case's photograph that still has a position; the process job builds the pyramid and records the original's SHA-256. Submitted, the case goes from draft to processing and is published when every image is ready; a failed image sends it back to draft with the reason. Server-Sent Events carry each job's steps back to the page.</desc>
  <style>
    :root { --bg: #fbfaf7; --ink: #1d232b; --muted: #5b6573; --line: #8a94a3; --box: #ffffff; --edge: #c9ced6;
            --accent: #1f6f8b; --warm: #b5651d; --store: #efe9dc; --lane: #f3f5f8; --good: #2f7d4f; --bad: #b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1419; --ink: #e6e9ee; --muted: #9aa5b4; --line: #6b7686; --box: #18202a; --edge: #2c3744;
              --accent: #5bb4d4; --warm: #e0a15c; --store: #231f18; --lane: #141b23; --good: #6fc08f; --bad: #f08a80; }
    }
    .bg { fill: var(--bg); }
    .lane { fill: var(--lane); stroke: var(--edge); stroke-width: 1; }
    .box { fill: var(--box); stroke: var(--edge); stroke-width: 1.5; }
    .key { fill: var(--box); stroke: var(--accent); stroke-width: 1.8; }
    .store { fill: var(--store); stroke: var(--warm); stroke-width: 1.5; }
    .state { fill: var(--box); stroke: var(--good); stroke-width: 1.8; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
    .m { font: 11.5px ui-monospace, "Cascadia Mono", Consolas, monospace; fill: var(--muted); }
    .h { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--accent); letter-spacing: .06em; }
    .ok { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--good); }
    .no { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--bad); }
    .arrow { stroke: var(--line); stroke-width: 1.6; fill: none; marker-end: url(#head); }
    .back { stroke: var(--bad); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#headbad); }
    .events { stroke: var(--accent); stroke-width: 1.4; fill: none; stroke-dasharray: 3 3; marker-end: url(#headacc); }
    .head { fill: var(--line); }
    .headbad { fill: var(--bad); }
    .headacc { fill: var(--accent); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="headbad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="headbad" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="headacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="headacc" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="640"/>

  <!-- the browser -->
  <rect class="lane" x="16" y="16" width="928" height="196" rx="10"/>
  <text class="h" x="32" y="38">THE BROWSER: /contribute/new, /contribute/&lt;id&gt;</text>
  <rect class="key" x="32" y="52" width="244" height="144" rx="8"/>
  <text class="t" x="44" y="74">the case, section by section</text>
  <text class="s" x="44" y="94">what it shows (anchor combobox)</text>
  <text class="s" x="44" y="112">the slide (drawn to scale beside)</text>
  <text class="s" x="44" y="130">images, the place, the drawer</text>
  <text class="s" x="44" y="148">review: messages by code, EN / ES</text>
  <text class="m" x="44" y="170">unsent: kept on this device</text>
  <text class="m" x="44" y="186">draft.ts to SlideCaseSubmission</text>

  <rect class="box" x="292" y="52" width="208" height="144" rx="8"/>
  <text class="t" x="304" y="74">each photograph</text>
  <text class="s" x="304" y="94">exifr: date, orientation, GPS</text>
  <text class="s" x="304" y="112">the position shown (R-087)</text>
  <text class="s" x="304" y="130">private: GPS IFD emptied,</text>
  <text class="s" x="304" y="148">XMP removed (R-1204)</text>
  <text class="m" x="304" y="170">JPEG PNG WebP TIFF</text>
  <text class="m" x="304" y="186">location.ts, photo.ts</text>

  <rect class="box" x="516" y="52" width="196" height="144" rx="8"/>
  <text class="t" x="528" y="74">pixel size</text>
  <text class="s" x="528" y="94">typed, from the scanner file,</text>
  <text class="s" x="528" y="112">or calibrated on a micrometer:</text>
  <text class="m" x="528" y="136">p = d / n</text>
  <text class="m" x="528" y="156">dp = 2p / n  (R-1207)</text>
  <text class="m" x="528" y="186">calibration.ts</text>

  <rect class="key" x="728" y="52" width="200" height="144" rx="8"/>
  <text class="t" x="740" y="74">the files</text>
  <text class="s" x="740" y="94">Uppy core + tus plugin,</text>
  <text class="s" x="740" y="112">headless, 50 MB chunks,</text>
  <text class="s" x="740" y="130">retries, pause, resume</text>
  <text class="s" x="740" y="148">progress per image</text>
  <text class="m" x="740" y="170">meta: slide, asset,</text>
  <text class="m" x="740" y="186">filename, filetype</text>

  <!-- the server -->
  <rect class="lane" x="16" y="228" width="928" height="220" rx="10"/>
  <text class="h" x="32" y="250">THE SERVER</text>
  <rect class="box" x="32" y="264" width="244" height="80" rx="8"/>
  <text class="t" x="44" y="286">validate, store the draft</text>
  <text class="m" x="44" y="306">POST /api/slide-cases/validate</text>
  <text class="m" x="44" y="324">POST, PUT, GET, DELETE /api/slide-cases</text>

  <rect class="box" x="32" y="356" width="244" height="76" rx="8"/>
  <text class="t" x="44" y="378">errors and flags</text>
  <text class="s" x="44" y="398">field, message, code, params</text>
  <text class="m" x="44" y="418">validation.&lt;code&gt; (R-1202)</text>

  <rect class="box" x="292" y="264" width="208" height="168" rx="8"/>
  <text class="t" x="304" y="286">tusd and its hooks</text>
  <text class="s" x="304" y="306">/files/ (nginx, or the preview)</text>
  <text class="s" x="304" y="324">pre-create: the session, the</text>
  <text class="s" x="304" y="342">draft and image, quotas, disk</text>
  <text class="s" x="304" y="360">post-finish: the verify job</text>
  <text class="m" x="304" y="384">quarantine/ until verified</text>
  <text class="m" x="304" y="404">the Cookie header forwarded</text>

  <rect class="box" x="516" y="264" width="196" height="168" rx="8"/>
  <text class="t" x="528" y="286">verify_upload</text>
  <text class="s" x="528" y="306">size, SHA-256, sniffed kind,</text>
  <text class="s" x="528" y="324">safe unpacking, header limits</text>
  <text class="no" x="528" y="346">private + a GPS position:</text>
  <text class="no" x="528" y="364">refused, with why (R-1203)</text>
  <text class="s" x="528" y="386">accepted: to sources/,</text>
  <text class="s" x="528" y="404">then process_asset queued</text>

  <rect class="store" x="728" y="264" width="200" height="168" rx="8"/>
  <text class="t" x="740" y="286">process_asset</text>
  <text class="s" x="740" y="306">read with libvips / OpenSlide</text>
  <text class="s" x="740" y="324">the pyramid (or a JPEG)</text>
  <text class="s" x="740" y="342">into the slide store</text>
  <text class="s" x="740" y="364">the original's SHA-256 kept</text>
  <text class="s" x="740" y="382">on the image (R-1208)</text>
  <text class="m" x="740" y="404">then cases.after_job</text>

  <!-- the lifecycle -->
  <rect class="lane" x="16" y="464" width="928" height="160" rx="10"/>
  <text class="h" x="32" y="486">THE CASE (R-1205, R-1206)</text>
  <rect class="state" x="60" y="510" width="180" height="64" rx="32"/>
  <text class="t" x="118" y="538">draft</text>
  <text class="s" x="86" y="558">its contributor's alone</text>
  <rect class="state" x="390" y="510" width="180" height="64" rx="32"/>
  <text class="t" x="438" y="538">processing</text>
  <text class="s" x="420" y="558">no more changes</text>
  <rect class="state" x="720" y="510" width="180" height="64" rx="32"/>
  <text class="t" x="770" y="538">published</text>
  <text class="s" x="746" y="558">/s/&lt;id&gt;, with its label</text>
  <path class="arrow" d="M240 530 L388 530"/>
  <text class="s" x="252" y="520">submit: every image has its file</text>
  <path class="arrow" d="M570 530 L718 530"/>
  <text class="s" x="584" y="520">every image ready, no job left</text>
  <path class="back" d="M478 576 C 470 606, 170 606, 152 578"/>
  <text class="no" x="250" y="614">an image failed: back to draft, with the reason</text>

  <!-- flows between lanes -->
  <path class="arrow" d="M154 196 L154 262"/>
  <path class="events" d="M140 262 L140 198"/>
  <path class="arrow" d="M828 196 C 828 230, 440 222, 400 262"/>
  <path class="arrow" d="M500 348 L514 348"/>
  <path class="arrow" d="M712 348 L726 348"/>
  <path class="events" d="M760 262 L760 198"/>
  <text class="s" x="770" y="228">job events (SSE) to the page</text>
  <path class="arrow" d="M828 432 C 828 470, 820 490, 812 508"/>
</svg>
