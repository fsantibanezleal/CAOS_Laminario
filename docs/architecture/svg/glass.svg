<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">The glass slide and its arrangements</title>
  <desc id="desc">Top: a glass slide as it is made and drawn, 76 by 26 by 1 millimetres of soda-lime glass with a refractive index of 1.5, a frosted end of 20 millimetres at each side, the name written on the left end and the facts on the right, and a coverslip 22 millimetres square and 0.17 millimetres thick over the sample, which is the node's icon, the specimen's image, or the whole slide's photograph. Bottom: the four arrangements the visitor chooses: a carousel whose ring turns the chosen slide to the front, the drawer of a steel filing cabinet with the slides standing one behind the other and the chosen one lifted by 30 millimetres, a 100-place slide box with two rows of slots and its lid open, and a 20-place folder of two columns of ten recesses. Every set has an accessible layer of links over the scene, and without WebGL the same slides are drawn flat.</desc>
  <style>
    :root { --bg: #fbfaf7; --ink: #1d232b; --muted: #5b6573; --line: #8a94a3; --glass: #e8f3ec; --edge: #7fae96;
            --frost: #f4f4ef; --accent: #1f6f8b; --warm: #b5651d; --steel: #b4bac0; --card: #d9c9a6; --box: #4f5f70; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1419; --ink: #e6e9ee; --muted: #9aa5b4; --line: #6b7686; --glass: #1f2e27; --edge: #6f9e86;
              --frost: #d9d9d2; --accent: #5bb4d4; --warm: #e0a15c; --steel: #6b737b; --card: #8c7b58; --box: #6c7f93; }
    }
    .bg { fill: var(--bg); }
    .glass { fill: var(--glass); stroke: var(--edge); stroke-width: 2; }
    .frost { fill: var(--frost); stroke: var(--edge); stroke-width: 1; }
    .cover { fill: none; stroke: var(--edge); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
    .m { font: 11.5px ui-monospace, "Cascadia Mono", Consolas, monospace; fill: var(--ink); }
    .h { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--accent); letter-spacing: .06em; }
    .dim { stroke: var(--line); stroke-width: 1; fill: none; marker-start: url(#end); marker-end: url(#end); }
    .end { fill: var(--line); }
    .icon { fill: none; stroke: var(--warm); stroke-width: 2; }
    .steel { fill: var(--steel); stroke: var(--line); stroke-width: 1; }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1; }
    .plastic { fill: var(--box); stroke: var(--line); stroke-width: 1; }
    .ring { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
    .chosen { stroke: var(--accent); stroke-width: 2.4; }
  </style>
  <defs>
    <marker id="end" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="end" d="M1 1 L9 5 L1 9 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="600"/>

  <!-- The object -->
  <text class="h" x="40" y="36">THE OBJECT (ISO 8037-1, ISO 8255-1)</text>
  <rect class="glass" x="120" y="70" width="608" height="208" rx="3"/>
  <rect class="frost" x="120" y="70" width="160" height="208"/>
  <rect class="frost" x="568" y="70" width="160" height="208"/>
  <rect x="120" y="70" width="160" height="16" fill="var(--warm)"/>
  <text class="m" x="134" y="112">Plants</text>
  <text class="s" x="134" y="132">the name, typed on</text>
  <text class="s" x="134" y="148">the frosted end</text>
  <text class="m" x="582" y="112">29 slides</text>
  <text class="m" x="582" y="130">7 drawers</text>
  <text class="s" x="582" y="158">the facts</text>
  <rect class="cover" x="336" y="86" width="176" height="176"/>
  <circle class="icon" cx="424" cy="174" r="52"/>
  <path class="icon" d="M392 158h64M392 190h64M392 158v32M413 158v32M435 158v32M456 158v32"/>
  <text class="s" x="330" y="296">coverslip 22 x 22 mm, 0.17 mm thick, over the icon,</text>
  <text class="s" x="330" y="312">the specimen's image, or none: a photographed slide is its photograph</text>
  <path class="dim" d="M120 330 H728"/>
  <text class="m" x="400" y="346">76 mm</text>
  <path class="dim" d="M100 70 V278"/>
  <text class="m" x="52" y="178">26 mm</text>
  <path class="dim" d="M120 56 H280"/>
  <text class="m" x="176" y="52">20 mm</text>
  <text class="s" x="752" y="100">soda-lime glass, 1 mm</text>
  <text class="s" x="752" y="116">refractive index 1.5</text>
  <text class="s" x="752" y="132">green at its edges</text>
  <text class="s" x="752" y="164">one transmission pass</text>
  <text class="s" x="752" y="180">for every slide of a set</text>
  <text class="s" x="752" y="212">28 slides are real glass:</text>
  <text class="s" x="752" y="228">15 slide photographs and</text>
  <text class="s" x="752" y="244">13 scanner macro photographs</text>

  <!-- The arrangements -->
  <text class="h" x="40" y="392">THE ARRANGEMENTS (THE VISITOR'S CHOICE, KEPT ON THE DEVICE)</text>

  <text class="t" x="40" y="420">Carousel</text>
  <ellipse class="ring" cx="130" cy="500" rx="86" ry="30"/>
  <rect class="glass" x="104" y="486" width="52" height="30"/>
  <rect class="glass chosen" x="104" y="486" width="52" height="30" fill="none"/>
  <rect class="glass" x="52" y="470" width="40" height="26" transform="skewY(-8)"/>
  <rect class="glass" x="170" y="506" width="40" height="26" transform="skewY(8)"/>
  <text class="s" x="40" y="560">R = 43 / sin(s/2), s = min(2 pi/n, 0.62)</text>

  <text class="t" x="270" y="420">Cabinet drawer</text>
  <rect class="steel" x="270" y="440" width="170" height="40"/>
  <rect class="steel" x="270" y="520" width="170" height="44"/>
  <rect class="glass" x="296" y="500" width="118" height="26"/>
  <rect class="glass" x="300" y="496" width="118" height="26"/>
  <rect class="glass chosen" x="304" y="462" width="118" height="26"/>
  <text class="s" x="270" y="584">slides on edge, 7 mm apart; the chosen one lifted 30 mm</text>

  <text class="t" x="520" y="420">Slide box</text>
  <path class="plastic" d="M520 470 L540 430 H680 L700 470 Z"/>
  <rect class="plastic" x="520" y="470" width="180" height="60"/>
  <rect class="glass" x="532" y="456" width="74" height="24"/>
  <rect class="glass" x="614" y="456" width="74" height="24"/>
  <text class="s" x="520" y="552">100 places, 2 rows of slots, lid open</text>

  <text class="t" x="760" y="420">Folder</text>
  <rect class="card" x="760" y="432" width="150" height="130"/>
  <g>
    <rect class="glass" x="768" y="440" width="64" height="20"/><rect class="glass" x="838" y="440" width="64" height="20"/>
    <rect class="glass" x="768" y="466" width="64" height="20"/><rect class="glass" x="838" y="466" width="64" height="20"/>
    <rect class="glass" x="768" y="492" width="64" height="20"/><rect class="glass" x="838" y="492" width="64" height="20"/>
    <rect class="glass" x="768" y="518" width="64" height="20"/><rect class="glass" x="838" y="518" width="64" height="20"/>
  </g>
  <text class="s" x="760" y="582">20 places, 2 columns of 10, a page at a time</text>
</svg>
