# Laminario on the production host: laminario.ml.fasl-work.com.
#
# Installed as /etc/nginx/sites-available/laminario.conf and linked into sites-enabled by deploy/install.sh, after
# the certificate exists (certbot certonly --nginx; the package's own timer renews it). Upstreams are on loopback
# only. The web app is the build in frontend/dist: its hashed assets are cached for a year, index.html never, and
# every address the app routes (/c/..., /s/..., /about) answers with index.html.
#
# IIIF image requests (region/size/rotation/quality.format after an identifier) go straight to iipsrv and are
# cached on the data volume for 30 days: a storage key names one processed file and never changes content,
# so a cached tile never goes stale. Before a tile is served, from the cache or not, nginx asks the API
# whether the identifier belongs to a published slide (auth_request, answer cached 60 s): a draft or a
# withdrawn image is refused within a minute of its status changing. info.json and manifests come from the
# API, which adds the public id and each asset's licence.

proxy_cache_path /srv/laminario/cache/tiles levels=1:2 keys_zone=laminario_tiles:64m max_size=10g
                 inactive=30d use_temp_path=off;
proxy_cache_path /srv/laminario/cache/access levels=1 keys_zone=laminario_access:8m max_size=64m
                 inactive=10m use_temp_path=off;

# keepalive_timeout stays under the backends' own idle close (uvicorn 5.0 s, iipsrv's lighttpd 6.0 s, measured on
# the host 2026-09-30): at nginx's 60 s default a request sent on a connection the backend was closing got
# "upstream prematurely closed connection" and the browser a 502 in place of the image.
upstream laminario_api {
    server 127.0.0.1:8147;
    keepalive 16;
    keepalive_timeout 4s;
}

upstream laminario_iipsrv {
    server 127.0.0.1:8149;
    keepalive 16;
    keepalive_timeout 4s;
}

upstream laminario_tusd {
    server 127.0.0.1:8148;
}

server {
    listen 80;
    listen [::]:80;
    server_name laminario.ml.fasl-work.com;
    return 301 https://$host$request_uri;
}

server {
    # No http2: on nginx 1.24 it is an option of the listening socket, which every site on the host shares, so
    # setting it here would change the other sites' protocol too.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name laminario.ml.fasl-work.com;

    ssl_certificate /etc/letsencrypt/live/laminario.ml.fasl-work.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laminario.ml.fasl-work.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/fasl-apps/CAOS_Laminario/frontend/dist;
    client_max_body_size 2m;  # the API's own requests; uploads go to /files/ below

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # The access check nginx runs before every tile. Never reachable from outside.
    location = /_laminario/iiif-access {
        internal;
        proxy_pass http://laminario_api/api/_internal/iiif-access/$iiif_key;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache laminario_access;
        proxy_cache_key $iiif_key;
        proxy_cache_valid 204 403 60s;
    }

    location ^~ /api/_internal/ {
        return 404;
    }

    # IIIF Image API requests: /iiif/{identifier}/{region}/{size}/{rotation}/{quality}.{format}. nginx matches
    # the decoded URI, where the identifier's %2F are slashes again, so the storage key is everything before
    # the last four segments.
    location ~ ^/iiif/(?<iiif_key>[A-Za-z0-9._/-]+)/[^/]+/[^/]+/[^/]+/[^/]+\.(?:jpg|png|webp|tif)$ {
        auth_request /_laminario/iiif-access;
        proxy_pass http://laminario_iipsrv;  # the request URI is passed unchanged
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache laminario_tiles;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Plain images of published slides (macro photographs, height maps) by their content-addressed storage key: the
    # API checks the slide is published and serves the file; nginx keeps a copy, since a key never changes.
    location /media/ {
        proxy_pass http://laminario_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache laminario_tiles;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Resumable uploads (tus 1.0) to tusd, which enforces the size limit and asks the API through its hooks. Bodies
    # stream through unbuffered: a chunk reaches tusd as it arrives, so an interrupted upload keeps what was sent.
    location /files/ {
        proxy_pass http://laminario_tusd;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # info.json, the base URI redirect, manifests and the rest of the API.
    location /iiif/ {
        proxy_pass http://laminario_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The world basemap, a Protomaps PMTiles extract read by byte ranges; the file changes only with its name.
    location = /api/explore/basemap.pmtiles {
        alias /srv/laminario/basemap/world-z7-20260928.pmtiles;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Accept-Ranges bytes always;
    }

    location /api/ {
        proxy_pass http://laminario_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (a job's progress) stream as they are written.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # The web app: hashed assets for a year, the rest (fonts, icons, the glyph sprite) for a day, index.html never.
    # `expires` rather than add_header, so these locations keep the server's security headers (a location with its
    # own add_header inherits none).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires 1d;
        try_files $uri @app;
    }

    location @app {
        expires -1;
        try_files /index.html =404;
    }
}
