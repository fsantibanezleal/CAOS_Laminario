# Materials a material anchor may name, each with the family that places it. A Laminario controlled vocabulary:
# the Materials collection holds what is neither an organism, a rock, a mineral nor a crystal, and the pollen
# samples of the Pollen and spores collection (a honey or air sample holds many taxa, so the sample is the anchor).
families:
  fibre: {en: Fibres and textiles, es: Fibras y textiles}
  food: {en: Food and starch grains, es: Alimentos y granos de almidón}
  dust: {en: Dust and microplastics, es: Polvo y microplásticos}
  paper: {en: Paper and wood products, es: Papel y derivados de la madera}
  pollen-sample: {en: Airborne and honey pollen, es: Polen del aire y de la miel}
terms:
