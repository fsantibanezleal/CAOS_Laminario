# Rock names a rock anchor may use, each with the family that places it in the tree.
#
# Sources (every term marked rcs-1, rcs-2 or rcs-3 is checked to occur in its volume by
# scripts/check_rock_terms.py, which reads the PDFs from the data vault):
#   rcs-1  Gillespie MR, Styles MT (1999) BGS Rock Classification Scheme, Vol. 1, Classification of igneous rocks,
#          2nd ed. British Geological Survey Research Report RR 99-06. https://nora.nerc.ac.uk/3223/
#          Terms and groups transcribed from its appendix, "List of approved names for igneous rocks". Group codes:
#          cgr coarse-grained crystalline, fgr fine-grained crystalline, vclast volcaniclastic, lamp lamprophyres,
#          meli melilitic, leuci leucitic, carb carbonatites, kimb kimberlites, kal kalsilitic, lamproite, charn
#          charnockitic, field field names. Figure 1 of the volume groups lamprophyres, melilitic, kalsilitic and
#          leucitic rocks, carbonatites, kimberlites and lamproites as the "exotic" crystalline rocks: the
#          igneous.exotic family. Field names follow the diagram they belong to (coarse or fine grained).
#   rcs-2  Robertson S (1999) BGS Rock Classification Scheme, Vol. 2, Classification of metamorphic rocks.
#          RR 99-02. https://nora.nerc.ac.uk/id/eprint/3226/  Root names from its appendix; the section is recorded.
#          Fabric groups: names defined by a schistosity or a mylonitic foliation are foliated; granofels, hornfels,
#          marble, quartzite, the cataclastic rocks and the metasomatic rocks are non-foliated; names defined by
#          protolith or composition alone (pelite, amphibolite, eclogite) stay at the metamorphic level.
#          The appendix prints "Ultramylonitite" and "Rodinsite"; the text of the volume spells them ultramylonite
#          and rodingite, which are used here.
#   rcs-3  Hallsworth CR, Knox RWO'B (1999) BGS Rock Classification Scheme, Vol. 3, Classification of sediments and
#          sedimentary rocks. RR 99-03. http://nora.nerc.ac.uk/3227/  Consolidated rocks are placed by their section
#          (2 siliciclastic; 3 carbonate; 7 non-carbonate salts as evaporites; 4, 5, 6, 8 and 9 as chemical and
#          biogenic); unconsolidated sediments go to soils and sediments. The scheme leaves breccia out on purpose.
#   met    Weisberg MK, McCoy TJ, Krot AN (2006) Systematics and evaluation of meteorite classification. In Lauretta
#          DS, McSween HY (eds) Meteorites and the Early Solar System II, 19-52. doi:10.2307/j.ctv1v7zdmm.8
#   lam    Laminario terms, for material the three volumes do not name (ore textures, soil).
#
# chromitite, ilmenitite and magnetitite are rcs-1 names without a group; Laminario places them with the ores.
source_labels:
  rcs-1: BGS Rock Classification Scheme, Vol. 1 (igneous)
  rcs-2: BGS Rock Classification Scheme, Vol. 2 (metamorphic)
  rcs-3: BGS Rock Classification Scheme, Vol. 3 (sediments and sedimentary rocks)
  met: Weisberg, McCoy and Krot (2006), meteorite classification
  lam: Laminario term
