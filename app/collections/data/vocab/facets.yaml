# Facets cut across the tree: a property a slide has wherever it is placed. Each facet value has its own icon, drawn
# in a square frame so it reads as a property and not as a place (dossier 03, section 5).
#   preparation   the ten preparation types of the ingestion contract (slide.preparation)
#   modality      the nine imaging modalities of the ingestion contract (asset.modality)
#   plant-organ   the plant organs of the part vocabulary (parts.yaml, facet: true)
#   crystal-system the seven crystal systems (crystals.yaml)
