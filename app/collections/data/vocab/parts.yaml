# The part of an organism a slide shows (specimen.part). Vertebrate slides are prepared by tissue, so the
# vertebrate collections are divided by organ system and each system lists the parts it holds (dossier 03); plant
# organs are a facet with their own icons. A slide without a part stays at its collection.
#
# group: the organ system (vertebrates) or plant organ facet the term belongs to, for documentation and forms.
