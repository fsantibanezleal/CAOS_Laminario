# Where the base collection's candidates come from, per collection (python -m app.base harvest).
#
# commons: a Wikimedia Commons category (depth: subcategory levels, limit: files kept)
# nhm: a full-text query on the NHM Data Portal's imaged specimens (filters: datastore filters)
# Candidates and review sheets are written to the data vault (LAMINARIO_FIXTURES/base/candidates). The whole-slide
# images (Zenodo NMNH, the OpenSlide corpus) are chosen by record in the lock, not harvested.

